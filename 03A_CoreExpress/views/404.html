<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e5e7eb;
      }

      .container {
        text-align: center;
        padding: 40px;
        max-width: 500px;
      }

      h1 {
        font-size: 96px;
        color: #38bdf8;
      }

      h2 {
        margin: 10px 0;
        font-size: 28px;
      }

      p {
        margin: 15px 0 30px;
        color: #cbd5f5;
      }

      a {
        display: inline-block;
        padding: 12px 24px;
        background: #38bdf8;
        color: #020617;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        transition: background 0.3s ease;
      }

      a:hover {
        background: #0ea5e9;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>Sorry, the page you’re looking for doesn’t exist or has been moved.</p>
      <a href="/">Go Back Home</a>
    </div>
  </body>
</html>
