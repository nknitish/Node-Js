<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Basic Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Basic Form</h2>

    <form method="post" action="/submit">
      <div>
        <label>Name:</label><br />
        <input type="text" name="name" />
      </div>

      <br />

      <div>
        <label>Email:</label><br />
        <input type="email" name="email" />
      </div>

      <br />

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
